preset: cli
locale: [en, zh]

exclude:
  - legacy/

badges:
  style: for-the-badge
  links: true

project:
  name: readme-gen
  tagline:
    en: "READMEs that cannot lie about their numbers."
    zh: "不会在数字上撒谎的 README 生成器。"
  description:
    en: "A zero-dependency Rust CLI that scans repository facts, renders a consistent structure, and optionally uses a local llama.cpp model for prose."
    zh: "零依赖 Rust CLI：扫描仓库事实、渲染稳定结构，可选本地 llama.cpp 模型撰写散文。"

